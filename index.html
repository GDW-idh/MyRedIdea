<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역트리 AI 유토피아 관리 시스템</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: rgba(255,255,255,0.08);
    --border-bright: rgba(255,255,255,0.18);
    --text-primary: #e8e6df;
    --text-secondary: #9c9a92;
    --text-muted: #5f5e5a;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    overflow: hidden;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .header-title {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    letter-spacing: 0.03em;
  }
  .header-title span { color: var(--text-primary); }

  .zoom-controls {
    display: flex; align-items: center; gap: 6px;
  }
  .zoom-btn {
    width: 30px; height: 30px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .zoom-btn:hover { background: #252a38; border-color: var(--border-bright); }
  .zoom-label {
    font-size: 12px; color: var(--text-secondary);
    min-width: 42px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .zoom-reset { font-size: 11px; padding: 0 10px; width: auto; }

  #canvas-wrap {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 0;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 32px 60px;
    cursor: grab;
  }
  #canvas-wrap:active { cursor: grabbing; }

  #diagram-container {
    transform-origin: top center;
    transition: transform 0.18s ease;
    width: 680px;
    flex-shrink: 0;
  }

  svg { display: block; overflow: visible; }
  svg text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
  .t  { font-size: 14px; font-weight: 400; }
  .ts { font-size: 12px; font-weight: 300; }
  .th { font-size: 14px; font-weight: 500; }

  .node-group { cursor: pointer; }
  .node-group rect { transition: filter 0.15s; }
  .node-group:hover rect { filter: brightness(1.3); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: #181c28;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    width: min(540px, 92vw);
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.22s ease;
    position: relative;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-header {
    padding: 24px 56px 18px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: flex-start; gap: 14px;
  }
  .modal-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .modal-tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px; border-radius: 4px;
    display: inline-block; margin-bottom: 7px;
  }
  .modal-title {
    font-size: 18px; font-weight: 700; line-height: 1.3;
    color: var(--text-primary);
  }
  .modal-close {
    position: absolute; top: 18px; right: 18px;
    width: 28px; height: 28px; border-radius: 6px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }

  .modal-body { padding: 20px 24px 26px; }
  .modal-section { margin-bottom: 20px; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 9px;
  }
  .modal-desc {
    font-size: 14px; line-height: 1.8; color: var(--text-secondary);
  }
  .modal-chips {
    display: flex; flex-wrap: wrap; gap: 7px;
  }
  .chip {
    font-size: 12px; padding: 4px 12px;
    border-radius: 20px; border: 1px solid;
    font-weight: 400; line-height: 1.4;
  }
  .modal-list {
    list-style: none; display: flex; flex-direction: column; gap: 7px;
  }
  .modal-list li {
    font-size: 13px; color: var(--text-secondary);
    padding-left: 16px; position: relative; line-height: 1.65;
  }
  .modal-list li::before {
    content: '›'; position: absolute; left: 0;
    color: var(--text-muted);
  }
  .modal-note {
    font-size: 12px; color: var(--text-muted);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-left-width: 3px;
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    line-height: 1.7;
  }

  .hint {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 14px;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>

<script>
/* ZOOM */
let scale = 1;
const container = document.getElementById('diagram-container');
const zoomLabel = document.getElementById('zoom-label');

function zoom(d) {
  scale = Math.min(3, Math.max(0.25, scale + d));
  container.style.transform = `scale(${scale})`;
  zoomLabel.textContent = Math.round(scale * 100) + '%';
}
function resetZoom() { scale = 1; container.style.transform = 'scale(1)'; zoomLabel.textContent = '100%'; }

document.getElementById('canvas-wrap').addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 0.1 : -0.1); }
}, { passive: false });

function openModal(key) {
  const d = DATA[key]; if (!d) return;
  document.getElementById('modal-icon').textContent = d.icon;
  document.getElementById('modal-icon').style.background = d.bg;
  const tag = document.getElementById('modal-tag');
  tag.textContent = d.tag;
  tag.style.cssText = `background:${d.bg};color:${d.color};border:1px solid ${d.color}55;`;
  document.getElementById('modal-title').textContent = d.title;

  const body = document.getElementById('modal-body');
  body.innerHTML = '';
  d.sections.forEach(s => {
    const sec = document.createElement('div'); sec.className = 'modal-section';
    const lbl = document.createElement('div'); lbl.className = 'modal-section-label'; lbl.textContent = s.label;
    sec.appendChild(lbl);
    if (s.type === 'desc') {
      const p = document.createElement('p'); p.className = 'modal-desc'; p.textContent = s.content; sec.appendChild(p);
    } else if (s.type === 'chips') {
      const w = document.createElement('div'); w.className = 'modal-chips';
      s.content.forEach(c => {
        const ch = document.createElement('span'); ch.className = 'chip'; ch.textContent = c;
        ch.style.cssText = `color:${d.color};background:${d.bg};border-color:${d.color}44;`; w.appendChild(ch);
      }); sec.appendChild(w);
    } else if (s.type === 'list') {
      const ul = document.createElement('ul'); ul.className = 'modal-list';
      s.content.forEach(item => { const li = document.createElement('li'); li.textContent = item; ul.appendChild(li); });
      sec.appendChild(ul);
    } else if (s.type === 'note') {
      const n = document.createElement('div'); n.className = 'modal-note';
      n.style.borderLeftColor = d.color; n.textContent = s.content; sec.appendChild(n);
    }
    body.appendChild(sec);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeOnBackdrop(e) { if (e.target.id === 'modal-overlay') closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
